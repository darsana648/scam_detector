<!DOCTYPE html>
<html>
<head>
    <title>AI Scam Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="bg-white p-6 rounded-lg shadow-lg w-96">
    <h2 class="text-xl font-bold mb-4 text-center">AI Scam Detector</h2>

    <form method="POST">
        <textarea name="message" class="w-full border p-2 mb-4" placeholder="Paste message here..." required></textarea>
        <button class="bg-blue-500 text-white px-4 py-2 w-full rounded">Check</button>
    </form>

    {% if result %}
    <div class="mt-4">
        <h3 class="font-bold">{{ result }}</h3>
        <p>Confidence: {{ score }}%</p>

        <ul class="text-sm mt-2">
            {% for r in reasons %}
            <li>• {{ r }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</div>

</body>
</html>
